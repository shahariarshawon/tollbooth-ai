name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
    services:
      # The gateway tests exercise the real rate limiter, budget counters and circuit breaker.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      # pgvector image: the initial migration creates the vector extension.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages must be built first: apps import their compiled output.
      - run: pnpm --filter "./packages/*" build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Builds every app, including the Next.js dashboard, to catch compile errors tests do not.
      - run: pnpm build
      - run: pnpm db:validate
      - run: pnpm db:deploy
      - run: pnpm --filter @tollbooth/control-plane test:e2e
        env:
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      # Runs the gateway against local fakes of the Gemini, OpenAI and Anthropic APIs, so no API key or network is needed.
      - run: pnpm --filter @tollbooth/gateway test:e2e
        env:
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  # Every production image builds, and each one's build cache is kept between runs.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, file: node-service, service: gateway, port: '3000' }
          - { name: control-plane, file: node-service, service: control-plane, port: '3001' }
          - { name: worker, file: node-service, service: worker, port: '3003' }
          - { name: dashboard, file: dashboard }
          - { name: ai-service, file: ai-service }
          - { name: migrate, file: migrate }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.file }}.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The whole production stack from empty volumes: migrations, health checks, public routes, the demo
  # session, and isolation of the control plane and the data stores.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke/compose-stack.sh

  # The public edge: runs infra/nginx/nginx.conf in front of stub upstreams and checks where each path goes.
  edge-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke/nginx-routing.sh

  # A fresh database, built only from the committed migrations.
  database:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      # The committed migrations must produce exactly the schema in schema.prisma. Fails if someone
      # changed the schema without writing a migration.
      - name: Check migrations match schema.prisma
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      # Seeding must be safe to repeat: the second run changes nothing. Reference data creates no users,
      # and the demo workspace's users have no usable password.
      - name: Seed reference and demo data twice
        run: |
          pnpm db:seed:reference && pnpm db:seed:reference
          pnpm db:seed:demo && pnpm db:seed:demo
          counts="$(PGPASSWORD=ci psql -h localhost -U ci -d ci -Atc "select (select count(*) from ai_providers) || ',' || (select count(*) from billing_plans) || ',' || (select count(*) from tenants where \"isDemo\") || ',' || (select count(*) from users where \"passwordHash\" <> '!')")"
          echo "providers,plans,demo tenants,users with a usable password = $counts"
          test "$counts" = "3,4,1,0"
