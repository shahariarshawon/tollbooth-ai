# The full Tollbooth AI stack, for a single Docker host. See docs/deployment.md.
#
#   cp .env.production.example .env.production   # fill in the secrets
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Startup order: infrastructure -> migrate (one-shot) -> services -> nginx. Services wait for the
# migration job to finish, so they never race to migrate.
#
# Networks: nginx is on `edge` only, together with the two services it may route to (gateway,
# dashboard). The control plane is on `backend` only, so the public edge cannot reach it even by
# mistake; the dashboard's server-side code reaches it over `backend`.
name: tollbooth-prod

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    <<: *service
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    <<: *service
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    <<: *service
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [backend]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── One-shot database job ───────────────────────────────────────────────────
  # Applies committed migrations (prisma migrate deploy) and seeds reference data (providers, models,
  # billing plans), which only ever creates missing rows. It creates no users or credentials.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    image: tollbooth/migrate:${TAG:-latest}
    command: ['migrate-and-seed']
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  # ── Application services ────────────────────────────────────────────────────
  ai-service:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile
    image: tollbooth/ai-service:${TAG:-latest}
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]

  gateway:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: gateway, PORT: '3000' }
    image: tollbooth/gateway:${TAG:-latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:9092
      AI_SERVICE_URL: http://ai-service:8000
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_AI_BASE_URL: ${GOOGLE_AI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_MAX_TOKENS: ${GATEWAY_MAX_TOKENS:-4096}
      GATEWAY_PROVIDER_TIMEOUT_MS: ${GATEWAY_PROVIDER_TIMEOUT_MS:-30000}
      GATEWAY_MAX_PROVIDER_RETRIES: ${GATEWAY_MAX_PROVIDER_RETRIES:-3}
      GATEWAY_SECURITY_TIMEOUT_MS: ${GATEWAY_SECURITY_TIMEOUT_MS:-3000}
      GATEWAY_SECURITY_FAIL_OPEN: ${GATEWAY_SECURITY_FAIL_OPEN:-false}
      GATEWAY_FAIL_OPEN: ${GATEWAY_FAIL_OPEN:-false}
      GATEWAY_CIRCUIT_FAILURE_THRESHOLD: ${GATEWAY_CIRCUIT_FAILURE_THRESHOLD:-5}
      GATEWAY_CIRCUIT_OPEN_MS: ${GATEWAY_CIRCUIT_OPEN_MS:-30000}
      TRUST_PROXY_HOPS: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks: [backend, edge]

  control-plane:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: control-plane, PORT: '3001' }
    image: tollbooth/control-plane:${TAG:-latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 characters)}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-15m}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # The dashboard's server is the one proxy in front of this service.
      TRUST_PROXY_HOPS: '1'
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_SESSION_MINUTES: ${DEMO_SESSION_MINUTES:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  dashboard:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
    image: tollbooth/dashboard:${TAG:-latest}
    environment:
      CONTROL_PLANE_URL: http://control-plane:3001
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      control-plane:
        condition: service_healthy
    networks: [backend, edge]

  worker:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: worker, PORT: '3003' }
    image: tollbooth/worker:${TAG:-latest}
    environment:
      NODE_ENV: production
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [backend]

  # ── Public edge ─────────────────────────────────────────────────────────────
  nginx:
    <<: *service
    image: nginx:1.27-alpine
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/upstreams.compose.conf:/etc/nginx/upstreams.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Observability ──────────────────────────────────────────────────────────
  prometheus:
    <<: *service
    image: prom/prometheus:v3.0.1
    volumes:
      - ./infra/monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    <<: *service
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3030}
    ports:
      - '${GRAFANA_PORT:-3030}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health | grep -q ok']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  backend:
  edge:

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
