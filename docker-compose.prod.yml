name: tollbooth-prod

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    <<: [*restart, *logging]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    <<: [*restart, *logging]
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [backend]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Application services ────────────────────────────────────────────────────
  ai-service:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile
    image: tollbooth/ai-service:${TAG:-latest}
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  gateway:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: infra/docker/gateway.Dockerfile
    image: tollbooth/gateway:${TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:9092
      AI_SERVICE_URL: http://ai-service:8000
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      GOOGLE_AI_BASE_URL: ${GOOGLE_AI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_MAX_TOKENS: ${GATEWAY_MAX_TOKENS:-4096}
      GATEWAY_PROVIDER_TIMEOUT_MS: ${GATEWAY_PROVIDER_TIMEOUT_MS:-30000}
      GATEWAY_MAX_PROVIDER_RETRIES: ${GATEWAY_MAX_PROVIDER_RETRIES:-3}
      GATEWAY_SECURITY_TIMEOUT_MS: ${GATEWAY_SECURITY_TIMEOUT_MS:-3000}
      GATEWAY_SECURITY_FAIL_OPEN: ${GATEWAY_SECURITY_FAIL_OPEN:-false}
      GATEWAY_FAIL_OPEN: ${GATEWAY_FAIL_OPEN:-false}
      GATEWAY_CIRCUIT_FAILURE_THRESHOLD: ${GATEWAY_CIRCUIT_FAILURE_THRESHOLD:-5}
      GATEWAY_CIRCUIT_OPEN_MS: ${GATEWAY_CIRCUIT_OPEN_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  control-plane:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: infra/docker/control-plane.Dockerfile
    image: tollbooth/control-plane:${TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-15m}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  dashboard:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
    image: tollbooth/dashboard:${TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: '3002'
      CONTROL_PLANE_URL: http://control-plane:3001
    depends_on:
      control-plane:
        condition: service_healthy
    networks: [frontend]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    image: tollbooth/worker:${TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: '3003'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [backend]

  # ── Reverse proxy ───────────────────────────────────────────────────────────
  nginx:
    <<: [*restart, *logging]
    image: nginx:1.27-alpine
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks: [frontend]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Observability ──────────────────────────────────────────────────────────
  prometheus:
    <<: [*restart, *logging]
    image: prom/prometheus:v3.0.1
    volumes:
      - ./infra/monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    <<: [*restart, *logging]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3030}
    ports:
      - '${GRAFANA_PORT:-3030}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health | grep -q ok']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  backend:
  frontend:

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
