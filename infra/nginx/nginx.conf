events {}

http {
  # Single public entrypoint. Upstreams are the apps running on the host.
  upstream gateway       { server host.docker.internal:3000; }
  upstream control_plane { server host.docker.internal:3001; }
  upstream dashboard     { server host.docker.internal:3002; }

  server {
    listen 80;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location /v1/ {
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Streaming LLM responses must not be buffered.
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    location /api/ {
      proxy_pass http://control_plane;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://dashboard;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
