# Public edge for Tollbooth AI. Used by docker-compose.prod.yml, and by the optional local `edge` profile.
#
# External routing:
#
#   /v1/*  -> gateway     the OpenAI-compatible API, called with API keys
#   /*     -> dashboard   the Next.js app: pages, and the browser-facing BFF routes /api/auth/* and
#                         /api/cp/*, which authenticate with httpOnly cookies
#
# The control plane is private. It has no upstream here: only the dashboard's server-side code talks
# to it, over the internal network. /api/* must never be forwarded to it, because those routes belong to
# the dashboard's BFF, not to the control plane's own (differently shaped) HTTP API.
#
# Upstream addresses come from upstreams.conf, which differs between the compose stack and the local
# edge profile (where the apps run on the host).

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  include       /etc/nginx/upstreams.conf;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

  # Rate limits are per client address. The gateway also limits per API key and tenant (Redis); this
  # layer only sheds floods before they reach Node.
  limit_req_zone $binary_remote_addr zone=gateway:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  # One id per request, honoured when the caller already sent a well-formed one. Both the gateway and the
  # dashboard log it, so a request can be followed across services.
  map $http_x_request_id $request_correlation_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # Headers for the responses nginx itself sends and for those from upstreams that set none.
  # HSTS is deliberately absent: it is only correct where HTTPS is guaranteed, which depends on whatever
  # terminates TLS in front of this server.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # The client address is this connection's peer, never a header the caller sent. Backends treat
  # X-Forwarded-For as set by this proxy (see docs/security.md for the trust model).
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_correlation_id;

  server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /v1/ {
      limit_req zone=gateway burst=60 nodelay;
      # Slightly above the gateway's own 1 MB JSON limit, so oversized bodies get the gateway's
      # OpenAI-style error rather than an HTML 413 from here.
      client_max_body_size 2m;

      proxy_pass http://gateway;
      # Server-sent events must reach the client as they are produced.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Sign-in, refresh and demo-session routes of the dashboard BFF: the credential-guessing surface.
    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://dashboard;
    }

    location / {
      proxy_pass http://dashboard;
    }
  }
}
