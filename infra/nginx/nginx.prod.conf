events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;

  # ── Gzip ────────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/xml+rss application/atom+xml image/svg+xml;

  # ── Rate limiting ────────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # ── Upstreams ────────────────────────────────────────────────────────────────
  upstream gateway       { server gateway:3000; }
  upstream control_plane { server control-plane:3001; }
  upstream dashboard     { server dashboard:3002; }

  # ── Security headers (applied globally) ─────────────────────────────────────
  add_header X-Frame-Options          DENY            always;
  add_header X-Content-Type-Options   nosniff         always;
  add_header X-XSS-Protection         "1; mode=block" always;
  add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

  server {
    listen 80;
    server_name _;

    # ── Health check (load balancer probe) ───────────────────────────────────
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    # ── AI gateway ───────────────────────────────────────────────────────────
    location /v1/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Streaming responses must not be buffered
      proxy_buffering    off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # ── Control-plane API ────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=20 nodelay;

      proxy_pass http://control_plane;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Internal health endpoints (not rate-limited) ─────────────────────────
    location = /health/gateway {
      proxy_pass http://gateway/health;
      proxy_set_header Host $host;
      access_log off;
    }

    location = /health/control-plane {
      proxy_pass http://control_plane/health;
      proxy_set_header Host $host;
      access_log off;
    }

    # ── Next.js dashboard (catch-all) ────────────────────────────────────────
    location / {
      proxy_pass http://dashboard;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
    }
  }
}
